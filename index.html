</section>
</main>
<div class="modal hidden" id="customModal"><div class="card"><button class="close" id="closeModal" type="button">×</button><h2>Otro monto</h2>

<input type="hidden" name="_subject" value="Solicitud de enlace de pago"><input type="hidden" name="_captcha" value="false">
<input type="text" name="nombre" placeholder="Nombre completo" required><input type="tel" name="celular" placeholder="Celular" required>
<input type="email" name="correo" placeholder="Correo electrónico" required><input type="text" name="valor" placeholder="Valor a donar" required>
<label><input type="checkbox" name="autorizacion" required>Acepto el tratamiento de mis datos.</label><button class="send" type="submit">Enviar</button>
</form><small>habeasdata@fundacioncardioinfantil.com.co</small></div></div>
